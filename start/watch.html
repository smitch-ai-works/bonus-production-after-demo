<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>パソコン操作ガイド</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:white;font-family:"Meiryo",sans-serif}header{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1920px;margin:auto;padding:16px 22px}a{color:#c8dcff;font-size:16px}h1{font-size:18px;margin:0}video{display:block;width:100%;height:auto;max-height:calc(100svh - 130px);object-fit:contain;background:#111}button{display:block;margin:16px auto;padding:14px 32px;border:0;border-radius:6px;background:#dceaff;color:#18354a;font:700 18px/1.6 "Meiryo",sans-serif;cursor:pointer}button[hidden]{display:none}</style><header><a href="./">使い方へ戻る</a><h1 id="title">操作ガイド</h1></header><video id="watch" controls playsinline preload="metadata" width="1920" height="1080"></video><button id="play" type="button">動画を再生する</button><script>const cfg={"windows": {"src": "videos/pc-guide.mp4?v=0a2b43cafe13", "poster": "videos/pc-poster.jpg?v=f45df37a292d"}, "mac": {"src": "videos/mac-guide.mp4?v=451877d363b3", "poster": "videos/mac-poster.jpg?v=fd49372f1f2d"}},params=new URLSearchParams(location.search),os=params.get('os')==='mac'?'mac':'windows',v=document.getElementById('watch'),play=document.getElementById('play');document.getElementById('title').textContent=(os==='mac'?'Mac':'Windows')+'の操作ガイド';v.src=cfg[os].src;v.poster=cfg[os].poster;let first=true;play.addEventListener('click',async()=>{try{await v.play();if(first){const t=Math.max(0,Number(params.get('t'))||0);v.currentTime=Number.isFinite(v.duration)&&t>=v.duration-1?0:t;first=false;}play.hidden=true;}catch{play.textContent='もう一度、再生する';}});</script></html>
